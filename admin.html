<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor de Cocina - KDS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: #1a1a1a; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    header { background-color: #2c3e50; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #c0392b; }
    header h1 { font-size: 1.8rem; display: flex; align-items: center; gap: 10px; }
    .clock { font-size: 1.5rem; font-weight: bold; color: #f1c40f; }
    .cocinero-select { background: #34495e; color: white; border: 1px solid #f1c40f; padding: 8px 15px; border-radius: 5px; font-size: 1.1rem; margin-left: 20px; outline: none; cursor: pointer; }
    
    .grid-pedidos { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; padding: 20px; overflow-y: auto; height: 100%; align-content: start; }
    .tarjeta { background-color: #2c3e50; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.5); display: flex; flex-direction: column; border-top: 8px solid #e74c3c; transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; }
    .tarjeta:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.7); }
    .tarjeta.en-preparacion { border-top-color: #f1c40f; } 
    .tarjeta.ocupado { border-top-color: #7f8c8d; opacity: 0.7; cursor: not-allowed; }
    
    .tarjeta-header { background-color: rgba(0,0,0,0.2); padding: 15px; display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .tarjeta-header h2 { font-size: 1.5rem; color: #fff; margin: 0; }
    .tarjeta-header .hora { font-size: 0.9rem; color: #bdc3c7; margin-top: 5px; }
    
    .tarjeta-body { padding: 15px; flex-grow: 1; }
    /* Ajustamos la lista para que no se parta en cajas feas */
    .lista-detalles { list-style: none; margin-bottom: 15px; }
    .lista-detalles li { font-size: 1.2rem; margin-bottom: 12px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 6px; border-left: 4px solid #e74c3c; color: #ecf0f1; line-height: 1.4; }
    
    .tarjeta-footer { padding: 15px; background-color: rgba(0,0,0,0.3); display: flex; gap: 10px; }
    .btn-accion { flex: 1; padding: 15px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; text-transform: uppercase; }
    .btn-empezar { background-color: #f39c12; color: white; }
    .btn-empezar:hover { background-color: #d68910; }
    .btn-terminar { background-color: #27ae60; color: white; }
    .btn-terminar:hover { background-color: #219150; }
    .btn-bloqueado { background-color: #95a5a6; color: #333; cursor: not-allowed; }

    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    .modal-content { background: #2c3e50; width: 100%; max-width: 600px; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border-top: 10px solid #c0392b; animation: aparecer 0.3s ease; display: flex; flex-direction: column; max-height: 90vh; }
    @keyframes aparecer { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    
    .modal-header { padding: 20px; background: rgba(0,0,0,0.3); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .modal-header h2 { font-size: 1.8rem; color: #f1c40f; }
    .btn-cerrar { background: none; border: none; color: #fff; font-size: 2rem; cursor: pointer; line-height: 1; }
    
    .modal-body { padding: 25px; overflow-y: auto; flex: 1; }
    .detalle-grupo { margin-bottom: 20px; }
    .detalle-grupo h3 { font-size: 1rem; color: #bdc3c7; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
    .detalle-grupo p { font-size: 1.2rem; color: #fff; }
    
    .detalle-lista { list-style: none; margin-top: 10px; }
    .detalle-lista li { font-size: 1.4rem; margin-bottom: 12px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 8px; border-left: 4px solid #e74c3c; line-height: 1.5; font-weight: 500; }
    
    /* Botón de cerrar gigante para el modal */
    .btn-cerrar-gigante { width: 100%; padding: 20px; background: #c0392b; color: white; border: none; font-size: 1.3rem; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: background 0.2s; }
    .btn-cerrar-gigante:hover { background: #a93226; }

    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; color: #7f8c8d; }
    .empty-state h2 { font-size: 2rem; margin-bottom: 10px; }
  </style>
</head>
<body>

  <header>
    <div style="display: flex; align-items: center;">
      <h1>👨‍🍳 Monitor de Cocina</h1>
      <select id="select-cocinero" class="cocinero-select" onchange="cambiarCocinero()">
        <option value="">-- Cargando cocineros... --</option>
      </select>
    </div>
    <div style="display: flex; align-items: center; gap: 15px;">
      <div class="connection-status" style="display: flex; align-items: center; gap: 8px;">
        <div class="dot" id="status-dot"></div>
        <span id="status-text">Conectado</span>
      </div>
      <div class="clock" id="reloj">00:00:00</div>
    </div>
  </header>

  <div class="grid-pedidos" id="contenedor-pedidos"></div>
  
  <div class="empty-state" id="empty-state" style="display: none;">
    <h2>¡Todo al día! 🍕</h2>
    <p>No hay pedidos pendientes en este momento.</p>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal-detalles" onclick="cerrarModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 id="modal-ticket">Ticket</h2>
      </div>
      <div class="modal-body">
        <div class="detalle-grupo">
          <h3>🛒 PRODUCTOS A PREPARAR</h3>
          <ul class="detalle-lista" id="modal-productos"></ul>
        </div>
        
        <div style="display: flex; justify-content: space-between; margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
          <div class="detalle-grupo">
            <h3>⏰ HORA</h3>
            <p id="modal-hora"></p>
          </div>
          <div class="detalle-grupo">
            <h3>📦 TIPO</h3>
            <p id="modal-tipo" style="font-weight: bold; color: #f1c40f;"></p>
          </div>
        </div>
      </div>
      <!-- Botón GIGANTE para cerrar -->
      <button class="btn-cerrar-gigante" onclick="document.getElementById('modal-detalles').style.display='none'">✖ CERRAR VENTANA</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://afarkzyxssgcpmnquqdp.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmYXJrenl4c3NnY3BtbnF1cWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMzI2NTUsImV4cCI6MjEwODcwODY1NX0.J7gSycaeum0bUzx9tss5OM4WfPUt5BswqxnSEI0RgiY';

    let pedidosGlobal = [];
    let miNombre = localStorage.getItem('cocina_nombre') || '';

    // Cargar los cocineros desde la base de datos
    async function cargarCocineros() {
      try {
        const response = await fetch(SUPABASE_URL + '/rest/v1/perfiles?select=nombre&or=(rol.eq.cocina,rol.eq.admin)', {
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
        });
        
        const perfiles = await response.json();
        const select = document.getElementById('select-cocinero');
        
        // Limpiamos el select
        select.innerHTML = '<option value="">-- Selecciona tu nombre --</option>';
        
        if (perfiles.length === 0) {
          // Si no hay perfiles, ponemos uno por defecto
          select.innerHTML += '<option value="Cocinero">Cocinero</option>';
        } else {
          perfiles.forEach(p => {
            select.innerHTML += `<option value="${p.nombre}">${p.nombre}</option>`;
          });
        }

        // Seleccionamos el nombre guardado si existe
        if (miNombre) {
          select.value = miNombre;
        } else {
          // Si no hay guardado, pedimos que elija
          miNombre = select.value;
        }

      } catch (error) {
        console.error('Error al cargar cocineros:', error);
        // Fallback por si falla
        const select = document.getElementById('select-cocinero');
        select.innerHTML = '<option value="Cocinero">Cocinero</option>';
      }
    }

    function cambiarCocinero() {
      miNombre = document.getElementById('select-cocinero').value;
      localStorage.setItem('cocina_nombre', miNombre);
      obtenerPedidos(); 
    }

    setInterval(() => {
      document.getElementById('reloj').textContent = new Date().toLocaleTimeString('es-ES');
    }, 1000);

    async function obtenerPedidos() {
      try {
        const response = await fetch(SUPABASE_URL + '/rest/v1/pedidos?select=*&estado=in.(Pendiente,En preparación)&order=fecha.asc', {
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
        });
        
        if (!response.ok) throw new Error('Error de red');
        
        const pedidos = await response.json();
        document.getElementById('status-dot').style.backgroundColor = '#27ae60';
        document.getElementById('status-text').textContent = 'Conectado';
        
        // Filtramos para mostrar solo los que no tienen dueño o son míos
        pedidosGlobal = pedidos.filter(p => !p.cocinero || p.cocinero === miNombre);
        renderizarPedidos(pedidosGlobal);

      } catch (error) {
        console.error(error);
        document.getElementById('status-dot').style.backgroundColor = '#e74c3c';
        document.getElementById('status-text').textContent = 'Desconectado';
      }
    }

    function renderizarPedidos(pedidos) {
      const contenedor = document.getElementById('contenedor-pedidos');
      const emptyState = document.getElementById('empty-state');
      
      if (pedidos.length === 0) {
        contenedor.innerHTML = '';
        emptyState.style.display = 'flex';
        return;
      }

      emptyState.style.display = 'none';
      
      contenedor.innerHTML = pedidos.map(p => {
        const esMio = p.cocinero === miNombre;
        const esDeOtro = p.cocinero && p.cocinero !== miNombre;
        
        let claseBorde = '';
        if (esMio) claseBorde = 'en-preparacion';
        else if (esDeOtro) claseBorde = 'ocupado';

        const hora = p.fecha ? new Date(p.fecha).toLocaleTimeString('es-ES', {hour: '2-digit', minute:'2-digit'}) : '--:--';
        
        // Como ahora todo el detalle viene con comas (por el join del index), lo mostramos entero en un solo bloque
        const textoDetalle = p.detalle ? p.detalle : 'Sin detalle';

        let botonera = '';
        if (esDeOtro) {
          botonera = `<button class="btn-accion btn-bloqueado">Lo prepara ${p.cocinero}</button>`;
        } else if (esMio) {
          botonera = `<button class="btn-accion btn-terminar" onclick="cambiarEstado('${p.order_id}', 'Listo', event)">✅ TERMINADO</button>`;
        } else {
          botonera = `<button class="btn-accion btn-empezar" onclick="tomarPedido('${p.order_id}', event)">▶ PREPARAR</button>`;
        }

        return `
          <div class="tarjeta ${claseBorde}" onclick="abrirModal('${p.order_id}')">
            <div class="tarjeta-header">
              <div>
                <h2>${p.order_id}</h2>
                <div class="hora">Llegada: ${hora}</div>
              </div>
              ${p.cocinero ? `<div style="font-size:0.8rem; background:#3498db; padding:2px 8px; border-radius:4px;">${p.cocinero}</div>` : ''}
            </div>
            
            <div class="tarjeta-body">
              <ul class="lista-detalles">
                <li>${textoDetalle}</li>
              </ul>
            </div>
            
            <div class="tarjeta-footer" onclick="event.stopPropagation()">
              ${botonera}
            </div>
          </div>
        `;
      }).join('');
    }

    async function tomarPedido(orderId, event) {
      event.stopPropagation();
      if (!miNombre) {
        alert('Por favor, selecciona tu nombre en el menú superior.');
        return;
      }

      try {
        const response = await fetch(SUPABASE_URL + '/rest/v1/pedidos?order_id=eq.' + orderId, {
          method: 'PATCH',
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ estado: 'En preparación', cocinero: miNombre })
        });

        if (!response.ok) throw new Error('Error');
        obtenerPedidos();

      } catch (error) { alert('Error al tomar el pedido.'); }
    }

    async function cambiarEstado(orderId, nuevoEstado, event) {
      if (event) event.stopPropagation();
      
      pedidosGlobal = pedidosGlobal.filter(p => p.order_id !== orderId);
      renderizarPedidos(pedidosGlobal);

      try {
        await fetch(SUPABASE_URL + '/rest/v1/pedidos?order_id=eq.' + orderId, {
          method: 'PATCH',
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ estado: nuevoEstado })
        });
        obtenerPedidos();
      } catch (error) { alert('Error al guardar.'); obtenerPedidos(); }
    }

    function abrirModal(orderId) {
      const pedido = pedidosGlobal.find(p => p.order_id === orderId);
      if (!pedido) return;

      const hora = pedido.fecha ? new Date(pedido.fecha).toLocaleString('es-ES') : '--:--';
      document.getElementById('modal-ticket').textContent = pedido.order_id;
      document.getElementById('modal-hora').textContent = hora;
      
      const esEnvio = pedido.direccion && pedido.direccion.trim() !== '' && pedido.direccion.toLowerCase() !== 'recogida en tienda';
      document.getElementById('modal-tipo').textContent = esEnvio ? 'PARA LLEVAR 🛵' : 'RECOGER EN TIENDA 🏪';

      // Mostramos todo el detalle en un solo bloque grande
      const textoDetalle = pedido.detalle ? pedido.detalle : 'Sin detalle';
      document.getElementById('modal-productos').innerHTML = `<li>${textoDetalle}</li>`;

      document.getElementById('modal-detalles').style.display = 'flex';
    }

    function cerrarModal(event) {
      if (event.target.id === 'modal-detalles') {
        document.getElementById('modal-detalles').style.display = 'none';
      }
    }

    // Iniciamos cargando cocineros y luego pidiendo pedidos
    async function init() {
      await cargarCocineros();
      obtenerPedidos();
      setInterval(obtenerPedidos, 10000);
    }

    init();
  </script>
</body>
</html>
