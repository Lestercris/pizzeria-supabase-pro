<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #c0392b; --secondary: #27ae60; --bg: #f4f7f6; --text: #333; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }
    
    .sidebar { width: 260px; background: #2c3e50; color: white; padding: 20px; display: flex; flex-direction: column; }
    .sidebar h2 { text-align: center; margin-bottom: 30px; font-size: 1.5rem; color: #f1c40f; }
    .sidebar button { background: none; border: none; color: white; padding: 12px 15px; text-align: left; font-size: 1rem; cursor: pointer; border-radius: 8px; transition: 0.3s; margin-bottom: 5px; }
    .sidebar button:hover, .sidebar button.active { background: var(--primary); }
    .sidebar .logout { margin-top: auto; color: #e74c3c; }
    .admin-only { display: none; }
    .hidden-panel { display: none; }

    .main-content { flex: 1; padding: 30px; overflow-y: auto; }
    
    #login-screen { position: fixed; inset: 0; background: rgba(44, 62, 80, 0.95); display: flex; align-items: center; justify-content: center; z-index: 9999; }
    .login-box { background: white; padding: 40px; border-radius: 15px; width: 100%; max-width: 400px; text-align: center; }
    .login-box h2 { color: var(--primary); margin-bottom: 20px; }
    
    input, select, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.95rem; outline: none; }
    input:focus, select:focus { border-color: var(--primary); }
    label { display: block; font-weight: 500; margin-bottom: 5px; font-size: 0.9rem; color: #555; }
    button.btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; transition: 0.3s; }
    button.btn:hover { background: #a93226; }
    button.btn-success { background: var(--secondary); }

    .grid-productos, .grid-slider { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
    .card img { width: 100%; height: 150px; object-fit: cover; background: #eee; }
    .card-body { padding: 15px; flex: 1; display: flex; flex-direction: column; }
    .card-body h3 { font-size: 1.1rem; margin-bottom: 5px; color: var(--primary); }
    .card-body .price { font-size: 1.2rem; font-weight: bold; color: var(--secondary); margin-bottom: 10px; }
    .card-actions { display: flex; gap: 10px; margin-top: auto; }
    .card-actions button { flex: 1; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; color: white; }
    .btn-edit { background: #3498db; }
    .btn-delete { background: #e74c3c; }

    .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--secondary); }
    input:checked + .slider:before { transform: translateX(26px); }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
    .alert { padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; font-weight: 500; }
    .alert-success { background: #d4edda; color: #155724; }
    .alert-error { background: #f8d7da; color: #721c24; }
    
    input[type="file"] { padding: 10px; background: #f8f9fa; border: 1px dashed #ccc; cursor: pointer; }
    .img-preview { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; display: none; }
  </style>
</head>
<body>

  <div id="login-screen">
    <div class="login-box">
      <h2 id="login-title">Panel de Administración</h2>
      <p style="margin-bottom: 20px; color: #666; font-size: 0.9rem;">Ingresa tus credenciales para gestionar el negocio.</p>
      <input type="email" id="login-email" placeholder="Correo electrónico">
      <input type="password" id="login-pass" placeholder="Contraseña">
      <button class="btn" onclick="login()">Entrar al Panel</button>
      <div id="login-msg" class="alert alert-error" style="margin-top: 15px;"></div>
    </div>
  </div>

  <div class="sidebar hidden-panel" id="sidebar">
    <h2 id="admin-header-title">🍕 Cargando...</h2>
    <button class="active" onclick="mostrarSeccion('productos', event)">📦 Productos</button>
    <button onclick="mostrarSeccion('slider', event)">🖼️ Slider de Inicio</button>
    <button onclick="mostrarSeccion('resenas', event)">⭐ Reseñas</button>
    <button onclick="mostrarSeccion('configuracion', event)">⚙️ Configuración</button>
    <button class="admin-only" onclick="mostrarSeccion('usuarios', event)">👥 Usuarios y Roles</button>
    <button class="logout" onclick="logout()">🚪 Cerrar Sesión</button>
  </div>

  <div class="main-content hidden-panel" id="main-panel">
    <div id="alert-box" class="alert"></div>

    <div id="seccion-productos">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1>Gestión de Productos</h1>
        <button class="btn btn-success" style="width: auto;" onclick="abrirModalNuevo()">+ Nuevo Producto</button>
      </div>
      <div class="grid-productos" id="lista-productos"></div>
    </div>

    <div id="seccion-slider" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1>Carrusel de Inicio (Slider)</h1>
        <button class="btn btn-success" style="width: auto;" onclick="abrirModalSlide()">+ Nueva Imagen</button>
      </div>
      <div class="grid-slider" id="lista-slides"></div>
    </div>

    <div id="seccion-resenas" style="display: none;">
      <h1>Gestión de Reseñas</h1>
      <div style="background: white; padding: 25px; border-radius: 12px; max-width: 800px; margin-top: 20px;">
        <div id="lista-resenas-admin"></div>
      </div>
    </div>

    <div id="seccion-configuracion" style="display: none;">
      <h1>Configuración de la Web</h1>
      <div style="background: white; padding: 25px; border-radius: 12px; max-width: 700px; margin-top: 20px;">
        <label>Nombre del Negocio</label>
        <input type="text" id="cfg-nombre">
        <label>Promoción del Día</label>
        <input type="text" id="cfg-promo">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
          <div><label>Teléfono de contacto</label><input type="text" id="cfg-telefono"></div>
          <div><label>Número de WhatsApp (solo números)</label><input type="text" id="cfg-whatsapp"></div>
        </div>
        <label>Dirección Física</label>
        <input type="text" id="cfg-direccion">
        <label>Horario de apertura</label>
        <input type="text" id="cfg-horario">
        <hr style="margin: 30px 0; border: none; border-top: 1px solid #eee;">
        <label>Habilitar Pago con Tarjeta (Stripe)</label>
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
          <label class="switch"><input type="checkbox" id="cfg-stripe"><span class="slider"></span></label>
          <span id="stripe-status-text">Desactivado</span>
        </div>
        <button class="btn btn-success" onclick="guardarConfiguracion()">Guardar Toda la Configuración</button>
      </div>
    </div>

    <div id="seccion-usuarios" style="display: none;">
      <h1>Usuarios y Roles</h1>
      <div style="background: white; padding: 25px; border-radius: 12px; max-width: 600px; margin-top: 20px;">
        <h3>Crear Nuevo Empleado</h3>
        <input type="text" id="new-user-name" placeholder="Nombre del empleado">
        <input type="email" id="new-user-email" placeholder="Correo electrónico">
        <input type="password" id="new-user-pass" placeholder="Contraseña temporal">
        <select id="new-user-role">
          <option value="empleado">Empleado (Solo ver y editar productos)</option>
          <option value="admin">Administrador (Control total)</option>
        </select>
        <button class="btn btn-success" onclick="crearEmpleado()">Crear Usuario</button>
      </div>
    </div>
  </div>

  <!-- MODAL PRODUCTO -->
  <div class="modal" id="modal-producto">
    <div class="modal-content">
      <h2 id="modal-title" style="margin-bottom: 20px; color: var(--primary);">Nuevo Producto</h2>
      <input type="hidden" id="prod-id-original">
      <label>ID del Producto</label>
      <input type="text" id="prod-id" required>
      <label>Nombre</label>
      <input type="text" id="prod-nombre" required>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div><label>Precio (€)</label><input type="number" id="prod-precio" step="0.01" required></div>
        <div><label>Categoría</label><input type="text" id="prod-categoria"></div>
      </div>
      <label>Descripción</label>
      <textarea id="prod-desc" rows="2"></textarea>
      <label>Ingredientes</label>
      <textarea id="prod-ingredientes" rows="2"></textarea>
      
      <label>Imagen del Producto</label>
      <img id="preview-prod" class="img-preview">
      <input type="file" id="file-prod" accept="image/*" onchange="subirImagenProducto(this)">
      <input type="hidden" id="prod-imagen">

      <label>Disponible en la Web</label>
      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
        <label class="switch"><input type="checkbox" id="prod-disponible" checked><span class="slider"></span></label>
      </div>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-success" onclick="guardarProducto()">Guardar</button>
        <button class="btn" style="background: #95a5a6;" onclick="cerrarModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- MODAL SLIDER -->
  <div class="modal" id="modal-slider">
    <div class="modal-content">
      <h2 style="margin-bottom: 20px; color: var(--primary);">Nueva Imagen del Slider</h2>
      <input type="hidden" id="slide-id-original">
      <label>Título (Opcional)</label>
      <input type="text" id="slide-titulo">
      <label>Subtítulo (Opcional)</label>
      <input type="text" id="slide-subtitulo">
      
      <label>Imagen del Slider</label>
      <img id="preview-slide" class="img-preview">
      <input type="file" id="file-slide" accept="image/*" onchange="subirImagenSlide(this)">
      <input type="hidden" id="slide-imagen">

      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button class="btn btn-success" onclick="guardarSlide()">Guardar</button>
        <button class="btn" style="background: #95a5a6;" onclick="document.getElementById('modal-slider').style.display = 'none'">Cancelar</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://afarkzyxssgcpmnquqdp.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmYXJrenl4c3NnY3BtbnF1cWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMzI2NTUsImV4cCI6MjEwODcwODY1NX0.J7gSycaeum0bUzx9tss5OM4WfPUt5BswqxnSEI0RgiY';
    
    // ⚠️ PEGA AQUÍ TU SERVICE_ROLE_KEY
    const SUPABASE_SERVICE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmYXJrenl4c3NnY3BtbnF1cWRwIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MzEzMjY1NSwiZXhwIjoyMTA4NzA4NjU1fQ.HmXW8r7uo9b5hohYLmi3koHLKHX-G9WTKBaSakKUO-w'; 

    let productosGlobal = [];
    let slidesGlobal = [];
    let userRole = 'empleado';

    async function fetchSupabase(endpoint, options = {}, useServiceKey = false) {
      const key = useServiceKey ? SUPABASE_SERVICE_KEY : SUPABASE_ANON_KEY;
      const headers = {
        'apikey': key, 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json',
        'Prefer': 'return=representation', ...options.headers
      };
      const res = await fetch(SUPABASE_URL + endpoint, { ...options, headers });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || 'Error en la petición');
      }
      return res.json();
    }

    function mostrarAlerta(mensaje, tipo = 'success') {
      const box = document.getElementById('alert-box');
      box.textContent = mensaje;
      box.className = `alert alert-${tipo}`;
      box.style.display = 'block';
      setTimeout(() => { box.style.display = 'none'; }, 4000);
    }

    async function login() {
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-pass').value;
      const btn = document.querySelector('#login-screen button');
      btn.textContent = 'Verificando...';

      try {
        const response = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
          method: 'POST',
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password: pass })
        });

        if (!response.ok) throw new Error('Credenciales incorrectas');
        
        const perfiles = await fetchSupabase(`/rest/v1/perfiles?email=eq.${email}`);
        if (perfiles.length > 0) userRole = perfiles[0].rol;
        else if (email === 'isahyles123@gmail.com') userRole = 'admin'; 

        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('sidebar').classList.remove('hidden-panel');
        document.getElementById('main-panel').classList.remove('hidden-panel');
        
        if (userRole === 'admin') document.querySelector('.admin-only').style.display = 'block';

        cargarProductos();
        cargarSlides();
        cargarConfiguracion();
        
      } catch (error) {
        document.getElementById('login-msg').textContent = error.message;
        document.getElementById('login-msg').style.display = 'block';
        btn.textContent = 'Entrar al Panel';
      }
    }

    function logout() { location.reload(); }

    function mostrarSeccion(id, event) {
      ['productos', 'slider', 'configuracion', 'usuarios', 'resenas'].forEach(sec => {
        document.getElementById(`seccion-${sec}`).style.display = sec === id ? 'block' : 'none';
      });
      document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('active'));
      if(event) event.target.classList.add('active');
      if(id === 'resenas') cargarResenas();
    }

        async function subirImagen(file, bucket = 'imagenes') {
      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}.${fileExt}`;
      const filePath = `${fileName}`;

      // Crear un FormData para enviar el archivo correctamente
      const formData = new FormData();
      formData.append('file', file);

      const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${bucket}/${filePath}`, {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
          // ⚠️ NO pongas 'Content-Type' aquí, el navegador lo pone solo con FormData
        },
        body: formData
      });

      if (!res.ok) {
        const errorText = await res.text();
        console.error('Error de Supabase Storage:', errorText);
        throw new Error('Error al subir la imagen: ' + errorText);
      }
      return `${SUPABASE_URL}/storage/v1/object/public/${bucket}/${filePath}`;
    }

    async function subirImagenProducto(input) {
      if (!input.files || input.files.length === 0) return;
      const file = input.files[0];
      const preview = document.getElementById('preview-prod');
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';

      try {
        const url = await subirImagen(file);
        document.getElementById('prod-imagen').value = url;
        mostrarAlerta('Imagen subida correctamente.');
      } catch (error) {
        mostrarAlerta('Error al subir imagen: ' + error.message, 'error');
      }
    }

    async function subirImagenSlide(input) {
      if (!input.files || input.files.length === 0) return;
      const file = input.files[0];
      const preview = document.getElementById('preview-slide');
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';

      try {
        const url = await subirImagen(file);
        document.getElementById('slide-imagen').value = url;
        mostrarAlerta('Imagen subida correctamente.');
      } catch (error) {
        mostrarAlerta('Error al subir imagen: ' + error.message, 'error');
      }
    }

    async function cargarProductos() {
      const productos = await fetchSupabase('/rest/v1/productos?select=*&order=id');
      productosGlobal = productos;
      document.getElementById('lista-productos').innerHTML = productos.map(p => `
        <div class="card">
          <img src="${p.imagen_url || 'https://via.placeholder.com/300x150?text=Sin+Imagen'}">
          <div class="card-body">
            <h3>${p.nombre} ${!p.disponible ? '(Oculto)' : ''}</h3>
            <div class="price">${Number(p.precio).toFixed(2)} €</div>
            <div class="card-actions">
              <button class="btn-edit" onclick="abrirModalEditar('${p.id}')">✏️ Editar</button>
              <button class="btn-delete" onclick="eliminarProducto('${p.id}')">🗑️ Borrar</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function abrirModalNuevo() {
      document.getElementById('modal-title').textContent = 'Nuevo Producto';
      document.getElementById('prod-id-original').value = '';
      document.getElementById('prod-id').value = '';
      document.getElementById('prod-nombre').value = '';
      document.getElementById('prod-precio').value = '';
      document.getElementById('prod-categoria').value = 'Pizzas';
      document.getElementById('prod-desc').value = '';
      document.getElementById('prod-ingredientes').value = '';
      document.getElementById('prod-imagen').value = '';
      document.getElementById('file-prod').value = '';
      document.getElementById('preview-prod').style.display = 'none';
      document.getElementById('prod-disponible').checked = true;
      document.getElementById('modal-producto').style.display = 'flex';
    }

    function abrirModalEditar(id) {
      const p = productosGlobal.find(x => String(x.id) === String(id));
      if (!p) return;
      document.getElementById('modal-title').textContent = 'Editar Producto';
      document.getElementById('prod-id-original').value = p.id;
      document.getElementById('prod-id').value = p.id;
      document.getElementById('prod-nombre').value = p.nombre;
      document.getElementById('prod-precio').value = p.precio;
      document.getElementById('prod-categoria').value = p.categoria || '';
      document.getElementById('prod-desc').value = p.descripcion || '';
      document.getElementById('prod-ingredientes').value = p.ingredientes || '';
      document.getElementById('prod-imagen').value = p.imagen_url || '';
      
      const preview = document.getElementById('preview-prod');
      if(p.imagen_url) { preview.src = p.imagen_url; preview.style.display = 'block'; }
      else { preview.style.display = 'none'; }
      document.getElementById('file-prod').value = '';

      document.getElementById('prod-disponible').checked = p.disponible;
      document.getElementById('modal-producto').style.display = 'flex';
    }

    function cerrarModal() { document.getElementById('modal-producto').style.display = 'none'; }

    async function guardarProducto() {
      const idOriginal = document.getElementById('prod-id-original').value;
      const data = {
        id: document.getElementById('prod-id').value.trim(),
        nombre: document.getElementById('prod-nombre').value.trim(),
        categoria: document.getElementById('prod-categoria').value.trim(),
        precio: parseFloat(document.getElementById('prod-precio').value),
        descripcion: document.getElementById('prod-desc').value.trim(),
        ingredientes: document.getElementById('prod-ingredientes').value.trim(),
        imagen_url: document.getElementById('prod-imagen').value,
        disponible: document.getElementById('prod-disponible').checked
      };

      try {
        if (idOriginal) {
          await fetchSupabase(`/rest/v1/productos?id=eq.${idOriginal}`, { method: 'PATCH', body: JSON.stringify(data) });
        } else {
          await fetchSupabase('/rest/v1/productos', { method: 'POST', body: JSON.stringify(data) });
        }
        cerrarModal();
        cargarProductos();
        mostrarAlerta('Producto guardado.');
      } catch (error) {
        mostrarAlerta('Error: ' + error.message, 'error');
      }
    }

    async function eliminarProducto(id) {
      if (!confirm('¿Eliminar producto?')) return;
      await fetchSupabase(`/rest/v1/productos?id=eq.${id}`, { method: 'DELETE' });
      cargarProductos();
      mostrarAlerta('Producto eliminado.');
    }

    async function cargarSlides() {
      const slides = await fetchSupabase('/rest/v1/slides?select=*&order=orden');
      slidesGlobal = slides;
      document.getElementById('lista-slides').innerHTML = slides.map(s => `
        <div class="card">
          <img src="${s.imagen_url}">
          <div class="card-body">
            <h3>${s.titulo || 'Sin Título'}</h3>
            <div class="card-actions">
              <button class="btn-delete" onclick="eliminarSlide('${s.id}')">🗑️ Borrar</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function abrirModalSlide() {
      document.getElementById('slide-id-original').value = '';
      document.getElementById('slide-titulo').value = '';
      document.getElementById('slide-subtitulo').value = '';
      document.getElementById('slide-imagen').value = '';
      document.getElementById('file-slide').value = '';
      document.getElementById('preview-slide').style.display = 'none';
      document.getElementById('modal-slider').style.display = 'flex';
    }

       async function guardarSlide() {
      const fileInput = document.getElementById('file-slide');
      const imgUrlInput = document.getElementById('slide-imagen');
      
      // Si el usuario ha seleccionado una foto pero la URL aún no se ha guardado, esperamos un poco
      if (fileInput.files.length > 0 && !imgUrlInput.value) {
        mostrarAlerta('Subiendo imagen... por favor, espera un momento.', 'success');
        // Le damos 2 segundos a la subida para que termine
        await new Promise(resolve => setTimeout(resolve, 2000)); 
      }

      const data = {
        titulo: document.getElementById('slide-titulo').value.trim(),
        subtitulo: document.getElementById('slide-subtitulo').value.trim(),
        imagen_url: imgUrlInput.value,
        activo: true,
        orden: 1
      };

      if (!data.imagen_url) {
        return mostrarAlerta('Debes subir una imagen y esperar a que se complete la subida.', 'error');
      }

      try {
        await fetchSupabase('/rest/v1/slides', { method: 'POST', body: JSON.stringify(data) });
        document.getElementById('modal-slider').style.display = 'none';
        cargarSlides();
        mostrarAlerta('Imagen añadida al Slider.');
      } catch (error) {
        mostrarAlerta('Error: ' + error.message, 'error');
      }
    }
    async function eliminarSlide(id) {
      if (!confirm('¿Eliminar imagen del slider?')) return;
      await fetchSupabase(`/rest/v1/slides?id=eq.${id}`, { method: 'DELETE' });
      cargarSlides();
      mostrarAlerta('Imagen eliminada.');
    }

    async function cargarConfiguracion() {
      try {
        const data = await fetchSupabase('/rest/v1/configuracion?select=*');
        const config = {};
        data.forEach(item => config[item.clave] = item.valor);
        
        if(document.getElementById('cfg-nombre')) document.getElementById('cfg-nombre').value = config.nombre_negocio || '';
        if(document.getElementById('cfg-promo')) document.getElementById('cfg-promo').value = config.promocion || '';
        if(document.getElementById('cfg-telefono')) document.getElementById('cfg-telefono').value = config.telefono || '';
        if(document.getElementById('cfg-whatsapp')) document.getElementById('cfg-whatsapp').value = config.whatsapp || '';
        if(document.getElementById('cfg-direccion')) document.getElementById('cfg-direccion').value = config.direccion || '';
        if(document.getElementById('cfg-horario')) document.getElementById('cfg-horario').value = config.horario || '';
        if(document.getElementById('cfg-stripe')) document.getElementById('cfg-stripe').checked = (config.stripe_habilitado === 'true');

        const headerTitle = document.getElementById('admin-header-title');
        if (config.nombre_negocio) {
          if (headerTitle) headerTitle.textContent = '🍕 ' + config.nombre_negocio;
          document.title = 'Panel - ' + config.nombre_negocio;
          const loginTitle = document.getElementById('login-title');
          if (loginTitle) loginTitle.textContent = 'Panel - ' + config.nombre_negocio;
        } else {
          if (headerTitle) headerTitle.textContent = '🍕 Mi Negocio';
          document.title = 'Panel de Administración';
        }
      } catch (error) {
        console.error("Error cargando config:", error);
      }
    }

    document.getElementById('cfg-stripe')?.addEventListener('change', (e) => {
      document.getElementById('stripe-status-text').textContent = e.target.checked ? 'Activado' : 'Desactivado';
    });

    async function guardarConfiguracion() {
      const configs = [
        { clave: 'nombre_negocio', valor: document.getElementById('cfg-nombre').value.trim() },
        { clave: 'promocion', valor: document.getElementById('cfg-promo').value.trim() },
        { clave: 'telefono', valor: document.getElementById('cfg-telefono').value.trim() },
        { clave: 'whatsapp', valor: document.getElementById('cfg-whatsapp').value.trim() },
        { clave: 'direccion', valor: document.getElementById('cfg-direccion').value.trim() },
        { clave: 'horario', valor: document.getElementById('cfg-horario').value.trim() },
        { clave: 'stripe_habilitado', valor: document.getElementById('cfg-stripe').checked ? 'true' : 'false' }
      ];
      
      try {
        for (const c of configs) {
          const res = await fetch(SUPABASE_URL + '/rest/v1/configuracion', {
            method: 'POST',
            headers: {
              'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
              'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates'
            },
            body: JSON.stringify(c)
          });
          if (!res.ok) throw new Error('Error al guardar');
        }
        mostrarAlerta('Configuración guardada correctamente.');
        cargarConfiguracion(); 
      } catch (error) {
        mostrarAlerta('Error al guardar: ' + error.message, 'error');
      }
    }

    async function cargarResenas() {
      try {
        const resenas = await fetchSupabase('/rest/v1/resenas?select=*&order=fecha.desc');
        const cont = document.getElementById('lista-resenas-admin');
        if (resenas.length === 0) { cont.innerHTML = '<p>No hay reseñas todavía.</p>'; return; }
        cont.innerHTML = resenas.map(r => `
          <div style="border-bottom: 1px solid #eee; padding: 15px 0;">
            <div style="display: flex; justify-content: space-between;">
              <strong>${r.nombre}</strong>
              <span style="color: #f1c40f;">${'★'.repeat(r.estrellas)}${'☆'.repeat(5-r.estrellas)}</span>
            </div>
            <p style="font-size: 0.9rem; margin: 5px 0; color: #555;">"${r.comentario}"</p>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
              <span style="font-size: 0.8rem; background: ${r.aprobada ? '#d4edda' : '#fff3cd'}; padding: 3px 8px; border-radius: 4px;">
                ${r.aprobada ? 'Publicada' : 'Pendiente'}
              </span>
              ${!r.aprobada ? `<button class="btn" style="width: auto; padding: 5px 10px; font-size: 0.8rem; background: #27ae60;" onclick="aprobarResena(${r.id})">Aprobar</button>` : ''}
              <button class="btn" style="width: auto; padding: 5px 10px; font-size: 0.8rem; background: #e74c3c;" onclick="eliminarResena(${r.id})">Eliminar</button>
            </div>
          </div>
        `).join('');
      } catch (error) {
        document.getElementById('lista-resenas-admin').innerHTML = `<p style="color:red">Error al cargar reseñas. Asegúrate de tener la tabla 'resenas' creada en Supabase.</p>`;
      }
    }

    async function aprobarResena(id) {
      await fetchSupabase(`/rest/v1/resenas?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify({ aprobada: true }) });
      cargarResenas();
      mostrarAlerta('Reseña publicada.');
    }

    async function eliminarResena(id) {
      if (!confirm('¿Eliminar esta reseña?')) return;
      await fetchSupabase(`/rest/v1/resenas?id=eq.${id}`, { method: 'DELETE' });
      cargarResenas();
      mostrarAlerta('Reseña eliminada.');
    }

    async function crearEmpleado() {
      if (userRole !== 'admin') return mostrarAlerta('No tienes permisos', 'error');

      const nombre = document.getElementById('new-user-name').value.trim();
      const email = document.getElementById('new-user-email').value.trim();
      const pass = document.getElementById('new-user-pass').value;
      const rol = document.getElementById('new-user-role').value;

      if (!email || !pass) return mostrarAlerta('Email y contraseña requeridos', 'error');

      try {
        const authRes = await fetch(SUPABASE_URL + '/auth/v1/admin/users', {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_SERVICE_KEY,
            'Authorization': 'Bearer ' + SUPABASE_SERVICE_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password: pass, email_confirm: true })
        });

        if (!authRes.ok) throw new Error('Error al crear el usuario en Auth');
        const userData = await authRes.json();

        await fetchSupabase('/rest/v1/perfiles', {
          method: 'POST',
          headers: { 'Prefer': 'resolution=merge-duplicates' },
          body: JSON.stringify({ id: userData.id, email: email, rol: rol, nombre: nombre })
        }, true);

        mostrarAlerta(`Empleado ${nombre} creado con éxito.`);
        document.getElementById('new-user-name').value = '';
        document.getElementById('new-user-email').value = '';
        document.getElementById('new-user-pass').value = '';

      } catch (error) {
        mostrarAlerta('Error al crear empleado: ' + error.message, 'error');
      }
    }
  </script>
</body>
</html>
