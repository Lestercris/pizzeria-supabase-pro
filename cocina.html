<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor de Cocina - KDS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: #1a1a1a; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    header { background-color: #2c3e50; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #c0392b; }
    header h1 { font-size: 1.8rem; display: flex; align-items: center; gap: 10px; }
    .clock { font-size: 1.5rem; font-weight: bold; color: #f1c40f; }
    .connection-status { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background-color: #27ae60; box-shadow: 0 0 10px #27ae60; }

    /* Contenedor de las tarjetas de pedidos */
    .grid-pedidos { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 20px; overflow-y: auto; height: 100%; align-content: start; }

    .tarjeta { background-color: #2c3e50; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.5); display: flex; flex-direction: column; border-top: 8px solid #e74c3c; transition: transform 0.2s; }
    .tarjeta.en-preparacion { border-top-color: #f1c40f; } /* Amarillo para preparación */
    
    .tarjeta-header { background-color: rgba(0,0,0,0.2); padding: 15px; display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .tarjeta-header h2 { font-size: 1.5rem; color: #fff; margin: 0; }
    .tarjeta-header .hora { font-size: 0.9rem; color: #bdc3c7; margin-top: 5px; }
    
    .tarjeta-body { padding: 15px; flex-grow: 1; }
    .lista-detalles { list-style: none; margin-bottom: 15px; }
    .lista-detalles li { font-size: 1.2rem; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed rgba(255,255,255,0.1); }
    .cliente-info { font-size: 0.9rem; color: #bdc3c7; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; }
    
    .tarjeta-footer { padding: 15px; background-color: rgba(0,0,0,0.3); display: flex; gap: 10px; }
    .btn-accion { flex: 1; padding: 15px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; text-transform: uppercase; }
    .btn-empezar { background-color: #f39c12; color: white; }
    .btn-empezar:hover { background-color: #d68910; }
    .btn-terminar { background-color: #27ae60; color: white; }
    .btn-terminar:hover { background-color: #219150; }

    /* Estado vacío */
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; color: #7f8c8d; }
    .empty-state h2 { font-size: 2rem; margin-bottom: 10px; }
  </style>
</head>
<body>

  <header>
    <h1>👨‍🍳 Monitor de Cocina</h1>
    <div class="connection-status">
      <div class="dot" id="status-dot"></div>
      <span id="status-text">Conectado</span>
    </div>
    <div class="clock" id="reloj">00:00:00</div>
  </header>

  <div class="grid-pedidos" id="contenedor-pedidos">
    <div class="empty-state" id="empty-state" style="display: none;">
      <h2>¡Todo al día! 🍕</h2>
      <p>No hay pedidos pendientes en este momento.</p>
    </div>
  </div>

  <script>
    // === CONFIGURACIÓN SUPABASE ===
    const SUPABASE_URL = 'https://afarkzyxssgcpmnquqdp.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmYXJrenl4c3NnY3BtbnF1cWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMzI2NTUsImV4cCI6MjEwODcwODY1NX0.J7gSycaeum0bUzx9tss5OM4WfPUt5BswqxnSEI0RgiY';

    let pedidosGlobal = [];

    // Reloj en tiempo real
    setInterval(() => {
      const ahora = new Date();
      document.getElementById('reloj').textContent = ahora.toLocaleTimeString('es-ES');
    }, 1000);

    // Función para obtener los pedidos de Supabase
    async function obtenerPedidos() {
      try {
        // Traemos solo los pedidos que NO estén completados ni cancelados
        const response = await fetch(SUPABASE_URL + '/rest/v1/pedidos?select=*&estado=in.(Pendiente,En preparación)&order=fecha.asc', {
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
        });
        
        if (!response.ok) throw new Error('Error de red');
        
        const pedidos = await response.json();
        
        // Actualizamos el estado visual
        document.getElementById('status-dot').style.backgroundColor = '#27ae60';
        document.getElementById('status-dot').style.boxShadow = '0 0 10px #27ae60';
        document.getElementById('status-text').textContent = 'Conectado';
        
        // Solo re-renderizamos si hay cambios (para no parpadear)
        if (JSON.stringify(pedidos) !== JSON.stringify(pedidosGlobal)) {
          pedidosGlobal = pedidos;
          renderizarPedidos(pedidos);
        }

      } catch (error) {
        console.error(error);
        document.getElementById('status-dot').style.backgroundColor = '#e74c3c';
        document.getElementById('status-dot').style.boxShadow = '0 0 10px #e74c3c';
        document.getElementById('status-text').textContent = 'Desconectado';
      }
    }

    function renderizarPedidos(pedidos) {
      const contenedor = document.getElementById('contenedor-pedidos');
      const emptyState = document.getElementById('empty-state');
      
      if (pedidos.length === 0) {
        contenedor.innerHTML = '';
        emptyState.style.display = 'flex';
        contenedor.appendChild(emptyState);
        return;
      }

      emptyState.style.display = 'none';
      contenedor.innerHTML = pedidos.map(p => {
        const esPreparando = p.estado === 'En preparación';
        const claseBorde = esPreparando ? 'en-preparacion' : '';
        const hora = p.fecha ? new Date(p.fecha).toLocaleTimeString('es-ES', {hour: '2-digit', minute:'2-digit'}) : '--:--';
        
        // Formatear el detalle (viene separado por comas)
        const items = p.detalle ? p.detalle.split(',').map(item => `<li>🔸 ${item.trim()}</li>`).join('') : '<li>Sin detalle</li>';

        return `
          <div class="tarjeta ${claseBorde}">
            <div class="tarjeta-header">
              <div>
                <h2>${p.order_id}</h2>
                <div class="hora">Llegada: ${hora}</div>
              </div>
            </div>
            
            <div class="tarjeta-body">
              <ul class="lista-detalles">
                ${items}
              </ul>
              <div class="cliente-info">
                <strong>Cliente:</strong> ${p.nombre_cliente || 'Mostrador'}<br>
                ${p.direccion ? `<strong>Entrega:</strong> ${p.direccion}` : '<strong>Recogida en tienda</strong>'}
              </div>
            </div>
            
            <div class="tarjeta-footer">
              ${!esPreparando 
                ? `<button class="btn-accion btn-empezar" onclick="cambiarEstado('${p.order_id}', 'En preparación')">▶ Empezar a Preparar</button>`
                : `<button class="btn-accion btn-terminar" onclick="cambiarEstado('${p.order_id}', 'Listo')">✅ Pedido Terminado</button>`
              }
            </div>
          </div>
        `;
      }).join('');
    }

    // Función para cambiar el estado del pedido
    async function cambiarEstado(orderId, nuevoEstado) {
      try {
        const response = await fetch(SUPABASE_URL + '/rest/v1/pedidos?order_id=eq.' + orderId, {
          method: 'PATCH',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ estado: nuevoEstado })
        });

        if (!response.ok) throw new Error('Error al actualizar');
        
        // Forzamos una recarga inmediata para que desaparezca o cambie de color
        obtenerPedidos();

      } catch (error) {
        alert('Error al cambiar el estado del pedido. Revisa la conexión.');
      }
    }

    // Iniciar el ciclo de actualización automática cada 10 segundos
    obtenerPedidos(); // Primera carga
    setInterval(obtenerPedidos, 10000); // Actualizar cada 10s

  </script>
</body>
</html>
