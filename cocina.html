<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor de Cocina - KDS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: #1a1a1a; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    header { background-color: #2c3e50; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #c0392b; }
    header h1 { font-size: 1.8rem; display: flex; align-items: center; gap: 10px; }
    .clock { font-size: 1.5rem; font-weight: bold; color: #f1c40f; }
    
    .cocinero-select { 
      background: #34495e; 
      color: #f1c40f;
      font-weight: bold;
      border: 2px solid #f1c40f; 
      padding: 8px 12px; 
      border-radius: 5px; 
      font-size: 1.1rem; 
      margin-left: 20px; 
      outline: none; 
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }

    .cocinero-select option { background: #2c3e50; color: white; font-weight: normal; }
    
    .grid-pedidos { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 20px; overflow-y: auto; height: 100%; align-content: start; }
    .tarjeta { background-color: #2c3e50; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.5); display: flex; flex-direction: column; border-top: 8px solid #e74c3c; transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; }
    .tarjeta:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.7); }
    .tarjeta.en-preparacion { border-top-color: #f1c40f; } 
    .tarjeta.ocupado { border-top-color: #7f8c8d; opacity: 0.7; cursor: not-allowed; }
    
    .tarjeta-header { background-color: rgba(0,0,0,0.2); padding: 15px; display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .tarjeta-header h2 { font-size: 1.5rem; color: #fff; margin: 0; }
    .tarjeta-header .hora { font-size: 0.9rem; color: #bdc3c7; margin-top: 5px; }
    
    .tarjeta-body { padding: 15px; flex-grow: 1; }
    .lista-detalles { list-style: none; margin-bottom: 15px; }
    .lista-detalles li { font-size: 1.1rem; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed rgba(255,255,255,0.1); color: #ecf0f1; line-height: 1.4; }
    
    .tarjeta-footer { padding: 15px; background-color: rgba(0,0,0,0.3); display: flex; gap: 10px; }
    .btn-accion { flex: 1; padding: 15px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; text-transform: uppercase; }
    .btn-empezar { background-color: #f39c12; color: white; }
    .btn-empezar:hover { background-color: #d68910; }
    .btn-terminar { background-color: #27ae60; color: white; }
    .btn-terminar:hover { background-color: #219150; }
    .btn-bloqueado { background-color: #95a5a6; color: #333; cursor: not-allowed; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    .modal-content { background: #2c3e50; width: 100%; max-width: 600px; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border-top: 10px solid #c0392b; animation: aparecer 0.3s ease; }
    @keyframes aparecer { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    
    .modal-header { padding: 20px; background: rgba(0,0,0,0.3); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .modal-header h2 { font-size: 1.8rem; color: #f1c40f; }
    .btn-cerrar { background: none; border: none; color: #fff; font-size: 2rem; cursor: pointer; line-height: 1; }
    
    .modal-body { padding: 25px; }
    .detalle-grupo { margin-bottom: 20px; }
    .detalle-grupo h3 { font-size: 1rem; color: #bdc3c7; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
    .detalle-grupo p { font-size: 1.2rem; color: #fff; }
    .detalle-lista { list-style: none; margin-top: 10px; }
    .detalle-lista li { font-size: 1.3rem; margin-bottom: 10px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 8px; border-left: 4px solid #e74c3c; line-height: 1.4; }

    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; color: #7f8c8d; text-align: center; }
    .empty-state h2 { font-size: 2rem; margin-bottom: 10px; }
    
    .mensaje-inicial { color: #f1c40f; font-size: 1.2rem; padding: 20px; text-align: center; }

    /* Botón de salir */
    .btn-salir { background-color: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: background 0.2s; }
    .btn-salir:hover { background-color: #c0392b; }
  </style>
</head>
<body>

  <header>
    <div style="display: flex; align-items: center;">
      <h1>👨‍🍳 Monitor de Cocina</h1>
      <!-- Select dinámico -->
      <select id="select-cocinero" class="cocinero-select" onchange="cambiarCocinero()">
        <option value="">Cargando cocineros...</option>
      </select>
    </div>
    <div style="display: flex; align-items: center; gap: 15px;">
      <div class="connection-status" style="display: flex; align-items: center; gap: 8px;">
        <div class="dot" id="status-dot" style="width:10px; height:10px; border-radius:50%; background:#e74c3c;"></div>
        <span id="status-text">Esperando...</span>
      </div>
      <div class="clock" id="reloj">00:00:00</div>
      
      <!-- BOTÓN DE SALIR AÑADIDO AQUÍ -->
      <button class="btn-salir" onclick="cerrarSesionCocina()">🚪 Salir</button>
    </div>
  </header>

  <div class="grid-pedidos" id="contenedor-pedidos">
    <div class="mensaje-inicial" id="mensaje-inicial">⬆️ Selecciona tu nombre en la parte superior para cargar los pedidos ⬆️</div>
  </div>
  
  <div class="empty-state" id="empty-state" style="display: none;">
    <h2>¡Todo al día! 🍕</h2>
    <p>No hay pedidos pendientes en este momento.</p>
  </div>

  <div class="modal-overlay" id="modal-detalles" onclick="cerrarModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 id="modal-ticket">Ticket</h2>
        <button class="btn-cerrar" onclick="document.getElementById('modal-detalles').style.display='none'">×</button>
      </div>
      <div class="modal-body">
        <div class="detalle-grupo">
          <h3>🛒 PRODUCTOS A PREPARAR</h3>
          <ul class="detalle-lista" id="modal-productos"></ul>
        </div>
        
        <div style="display: flex; justify-content: space-between; margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
          <div class="detalle-grupo">
            <h3>⏰ HORA</h3>
            <p id="modal-hora"></p>
          </div>
          <div class="detalle-grupo">
            <h3>📦 TIPO</h3>
            <p id="modal-tipo" style="font-weight: bold; color: #f1c40f;"></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://afarkzyxssgcpmnquqdp.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmYXJrenl4c3NnY3BtbnF1cWRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMzI2NTUsImV4cCI6MjEwODcwODY1NX0.J7gSycaeum0bUzx9tss5OM4WfPUt5BswqxnSEI0RgiY';

    let pedidosGlobal = [];
    let miNombre = localStorage.getItem('cocina_nombre') || '';
    let intervaloCarga = null;

    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Primero cargamos los nombres reales de Supabase
      await cargarCocinerosDesdeBD();
      
      const select = document.getElementById('select-cocinero');
      
      // 2. Si el cocinero ya tenía su nombre guardado, lo seleccionamos
      if (miNombre) {
        const existe = Array.from(select.options).some(opt => opt.value === miNombre);
        if (existe) {
          select.value = miNombre;
          iniciarCarga();
        } else {
          select.value = "";
          localStorage.removeItem('cocina_nombre');
          miNombre = "";
        }
      }
    });

       // CARGAR COCINEROS DESDE LA TABLA PERFILES DE SUPABASE (SOLO ROL COCINA)
    async function cargarCocinerosDesdeBD() {
      const select = document.getElementById('select-cocinero');
      try {
        // CORREGIDO ESTRICTAMENTE: Solo trae a los que tienen el rol 'cocina'
        const res = await fetch(`${SUPABASE_URL}/rest/v1/perfiles?select=nombre,rol&rol=eq.cocina&order=nombre.asc`, {
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
        });
        
        if (!res.ok) throw new Error('Error al leer perfiles');
        
        const perfiles = await res.json();
        
        let html = '<option value="">-- Selecciona tu nombre --</option>';
        
        // Rellenamos el desplegable con los nombres de la BD
        perfiles.forEach(p => {
          if (p.nombre && p.nombre.trim() !== '') {
            html += `<option value="${p.nombre}">${p.nombre}</option>`;
          }
        });
        
        select.innerHTML = html;

      } catch (error) {
        console.error('Error:', error);
        select.innerHTML = `<option value="">Error de conexión</option>`;
      }
    }
    // FUNCIÓN PARA CERRAR SESIÓN Y VOLVER AL LOGIN
     async function cerrarSesionCocina() {
      // Borramos el nombre guardado en local
      localStorage.removeItem('cocina_nombre');
      
      // 🔥 Redirigimos al login del panel de administración
      window.location.href = 'admin.html'; 
    }

    function cambiarCocinero() {
      const select = document.getElementById('select-cocinero');
      const nuevoNombre = select.value;
      
      if (!nuevoNombre) {
        miNombre = "";
        localStorage.removeItem('cocina_nombre');
        if (intervaloCarga) clearInterval(intervaloCarga);
        document.getElementById('contenedor-pedidos').innerHTML = '<div class="mensaje-inicial">⬆️ Selecciona tu nombre en la parte superior para cargar los pedidos ⬆️</div>';
        document.getElementById('empty-state').style.display = 'none';
        document.getElementById('status-dot').style.backgroundColor = '#e74c3c';
        document.getElementById('status-text').textContent = 'Esperando...';
        return;
      }

      miNombre = nuevoNombre;
      localStorage.setItem('cocina_nombre', miNombre);
      iniciarCarga();
    }

    function iniciarCarga() {
      const mensaje = document.getElementById('mensaje-inicial');
      if (mensaje) mensaje.remove();

      obtenerPedidos();
      if (intervaloCarga) clearInterval(intervaloCarga);
      intervaloCarga = setInterval(obtenerPedidos, 10000);
    }

    setInterval(() => {
      document.getElementById('reloj').textContent = new Date().toLocaleTimeString('es-ES');
    }, 1000);

        async function obtenerPedidos() {
      if (!miNombre) return;

      try {
        // 🔥 AÑADIDO 'Pagado' a la lista de estados
        const response = await fetch(SUPABASE_URL + '/rest/v1/pedidos?select=*&estado=in.(Pagado,Pendiente,En preparación)&order=fecha.asc', {
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
        });
        
        if (!response.ok) throw new Error('Error de red');
        
        const pedidos = await response.json();
        document.getElementById('status-dot').style.backgroundColor = '#27ae60';
        document.getElementById('status-text').textContent = 'Conectado';
        
        pedidosGlobal = pedidos.filter(p => !p.cocinero || p.cocinero === miNombre);
        renderizarPedidos(pedidosGlobal);

      } catch (error) {
        console.error(error);
        document.getElementById('status-dot').style.backgroundColor = '#e74c3c';
        document.getElementById('status-text').textContent = 'Desconectado';
      }
    }

    // 🔥 NUEVA FUNCIÓN DE SEGURIDAD (XSS)
    function esc(txt) { 
      return String(txt == null ? '' : txt).replace(/[&<>"']/g, function (c) { 
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; 
      }); 
    }

    function renderizarPedidos(pedidos) {
      const contenedor = document.getElementById('contenedor-pedidos');
      const emptyState = document.getElementById('empty-state');
      
      if (pedidos.length === 0) {
        contenedor.innerHTML = '';
        emptyState.style.display = 'flex';
        return;
      }

      emptyState.style.display = 'none';
      
      contenedor.innerHTML = pedidos.map(p => {
        const esMio = p.cocinero === miNombre;
        const esDeOtro = p.cocinero && p.cocinero !== miNombre;
        
        let claseBorde = '';
        if (esMio) claseBorde = 'en-preparacion';
        else if (esDeOtro) claseBorde = 'ocupado';

        const hora = p.fecha ? new Date(p.fecha).toLocaleTimeString('es-ES', {hour: '2-digit', minute:'2-digit'}) : '--:--';
        const itemsArray = p.detalle ? p.detalle.split(',') : [];
        
        // 🔥 APLICAMOS esc() AQUÍ
        const items = itemsArray.map(item => `<li>🔸 ${esc(item.trim())}</li>`).join('');

        let botonera = '';
        if (esDeOtro) {
          botonera = `
            <button class="btn-accion btn-bloqueado" style="flex:2;">Lo prepara ${esc(p.cocinero)}</button>
            <button class="btn-accion" style="flex:1; background:#3498db;" onclick="imprimirComanda('${esc(p.order_id)}', event)">🖨️</button>
          `;
        } else if (esMio) {
          botonera = `
            <button class="btn-accion btn-terminar" style="flex:2;" onclick="cambiarEstado('${esc(p.order_id)}', 'Listo', event)">✅ TERMINADO</button>
            <button class="btn-accion" style="flex:1; background:#3498db;" onclick="imprimirComanda('${esc(p.order_id)}', event)">🖨️</button>
          `;
        } else {
          botonera = `
            <button class="btn-accion btn-empezar" style="flex:2;" onclick="tomarPedido('${esc(p.order_id)}', event)">▶ PREPARAR</button>
            <button class="btn-accion" style="flex:1; background:#3498db;" onclick="imprimirComanda('${esc(p.order_id)}', event)">🖨️</button>
          `;
        }

        return `
          <div class="tarjeta ${claseBorde}" onclick="abrirModal('${esc(p.order_id)}')">
            <div class="tarjeta-header">
              <div>
                <h2>${esc(p.order_id)}</h2>
                <div class="hora">Llegada: ${hora}</div>
              </div>
              ${p.cocinero ? `<div style="font-size:0.8rem; background:#3498db; padding:2px 8px; border-radius:4px;">${esc(p.cocinero)}</div>` : ''}
            </div>
            
            <div class="tarjeta-body">
              <ul class="lista-detalles">
                ${items}
              </ul>
            </div>
            
            <div class="tarjeta-footer" onclick="event.stopPropagation()">
              ${botonera}
            </div>
          </div>
        `;
      }).join('');
    }
     async function imprimirComanda(orderId, event) {
      if (event) event.stopPropagation();
      
      const pedido = pedidosGlobal.find(p => p.order_id === orderId);
      if (!pedido) return;

      const hora = pedido.fecha ? new Date(pedido.fecha).toLocaleString('es-ES') : '--:--';
      // 🔥 APLICAMOS esc() AQUÍ
      const items = pedido.detalle ? pedido.detalle.split(',').map(i => `<p style="margin: 4px 0; font-size: 14px;">${esc(i.trim())}</p>`).join('') : '';

      // Creamos un iframe oculto para imprimir sin salir de la pantalla de cocina
      const iframe = document.createElement('iframe');
      iframe.style.position = 'absolute';
      iframe.style.width = '0px';
      iframe.style.height = '0px';
      iframe.style.border = 'none';
      document.body.appendChild(iframe);

      const doc = iframe.contentWindow.document;
      doc.open();
      doc.write(`
        <html>
          <head>
            <title>Comanda ${esc(orderId)}</title>
            <style>
              body { font-family: 'Courier New', Courier, monospace; width: 72mm; margin: 0 auto; color: #000; }
              h2 { text-align: center; font-size: 16px; margin-bottom: 5px; }
              .hora { text-align: center; font-size: 12px; margin-bottom: 15px; }
              .items { border-top: 1px dashed #000; border-bottom: 1px dashed #000; padding: 10px 0; margin-bottom: 10px; }
              .footer { text-align: center; font-size: 10px; margin-top: 20px; }
            </style>
          </head>
          <body>
            <h2>COMANDA COCINA</h2>
            <div class="hora">Ticket: <strong>${esc(orderId)}</strong></div>
            <div class="hora">Hora: ${hora}</div>
            
            <div class="items">
              ${items}
            </div>
            
            <div class="footer">
              --- FIN DE COMANDA ---
            </div>
          </body>
        </html>
      `);
      doc.close();

      // Esperamos un momento a que cargue y lanzamos la impresión
      setTimeout(() => {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
        setTimeout(() => { document.body.removeChild(iframe); }, 1000);
      }, 500);
    }
    async function tomarPedido(orderId, event) {
      if (event) event.stopPropagation();
      if (!miNombre) return;

      // Actualización visual inmediata (Optimista)
      pedidosGlobal = pedidosGlobal.map(p => {
        if (p.order_id === orderId) return { ...p, estado: 'En preparación', cocinero: miNombre };
        return p;
      });
      renderizarPedidos(pedidosGlobal);

      try {
        const response = await fetch(SUPABASE_URL + '/rest/v1/pedidos?order_id=eq.' + encodeURIComponent(orderId), {
          method: 'PATCH',
          headers: { 
            'apikey': SUPABASE_ANON_KEY, 
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal' // 🔥 Optimización: no devolver datos innecesarios
          },
          body: JSON.stringify({ estado: 'En preparación', cocinero: miNombre })
        });

        if (!response.ok) throw new Error('Error al actualizar');
      } catch (error) {
        alert('Error al tomar el pedido. Revisa tu conexión.');
        obtenerPedidos(); // Si falla, recargamos para restaurar el estado real
      }
    }
       async function cambiarEstado(orderId, nuevoEstado, event) {
      if (event) event.stopPropagation();
      
      // Quitamos la tarjeta visualmente al instante
      pedidosGlobal = pedidosGlobal.filter(p => p.order_id !== orderId);
      renderizarPedidos(pedidosGlobal);

      try {
        // 🔥 Optimización: encodeURIComponent y return=minimal
        const response = await fetch(SUPABASE_URL + '/rest/v1/pedidos?order_id=eq.' + encodeURIComponent(orderId), {
          method: 'PATCH',
          headers: { 
            'apikey': SUPABASE_ANON_KEY, 
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal' 
          },
          body: JSON.stringify({ estado: nuevoEstado })
        });

        if (!response.ok) throw new Error('Error al actualizar');
      } catch (error) { 
        alert('Error al guardar.'); 
        obtenerPedidos(); 
      }
    }

    function abrirModal(orderId) {
      const pedido = pedidosGlobal.find(p => p.order_id === orderId);
      if (!pedido) return;

      const hora = pedido.fecha ? new Date(pedido.fecha).toLocaleString('es-ES') : '--:--';
      
      // 🔥 Seguridad XSS: Aplicamos esc()
      document.getElementById('modal-ticket').textContent = esc(pedido.order_id);
      document.getElementById('modal-hora').textContent = hora;
      
      const esEnvio = pedido.direccion && pedido.direccion.trim() !== '' && pedido.direccion.toLowerCase() !== 'recogida en tienda';
      document.getElementById('modal-tipo').textContent = esEnvio ? 'PARA LLEVAR 🛵' : 'RECOGER EN TIENDA 🏪';

      // 🔥 Seguridad XSS: Aplicamos esc()
      const items = pedido.detalle ? pedido.detalle.split(',').map(item => `<li>${esc(item.trim())}</li>`).join('') : '<li>Sin detalle</li>';
      document.getElementById('modal-productos').innerHTML = items;

      document.getElementById('modal-detalles').style.display = 'flex';
    }

    function cerrarModal(event) {
      if (event.target.id === 'modal-detalles') {
        document.getElementById('modal-detalles').style.display = 'none';
      }
    }
  </script>
</body>
</html>
